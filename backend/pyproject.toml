[project]
name = "checkoutguard-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "httpx>=0.28,<1", "backboard-sdk>=1.5.14,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Ruff formatter owns wrapping; preserve literal evidence and explanatory strings.
ignore = ["E501"]
